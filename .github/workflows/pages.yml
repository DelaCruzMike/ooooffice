name: Check and publish office
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      - name: Wait for matching building backend
        env:
          OFFICE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
        run: |
          node --input-type=module <<'NODE'
          const url = (process.env.OFFICE_SERVER_URL || 'https://ooooffice-server.onrender.com').replace(/\/$/, '');
          for (let attempt = 0; attempt < 180; attempt++) {
            try {
              const response = await fetch(url + '/health', {signal: AbortSignal.timeout(5000)});
              const health = await response.json();
              if (response.ok && health.ok && health.protocol === 5) process.exit(0);
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error('Protocol-5 backend is not ready; frontend publication stopped.');
          NODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
